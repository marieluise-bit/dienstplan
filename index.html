et: 35 Tage bei 6-Tage-Woche, anteilig nach Arbeitstagen, ohne Rundung. Bei Elternzeit oder Ein-/Austritt k\xFCrzt die App um 1/12 pro vollem Kalendermonat (Zw\xF6lftelung). Das ist ein Vorschlag, den die Leitung best\xE4tigt.']})},{id:"notdienst",title:"Notdienst",teaser:"Nacht ab 19:00 (Ladenschluss), Auszahlung statt automatischer Gutschrift",body:(0,Mt.jsxs)(Mt.Fragment,{children:["Tags\xFCber wird der Dienst normal im Plan eingetragen und z\xE4hlt ins Ist. Die Nachtbereitschaft beginnt um 19:00 mit dem Ladenschluss und geht bis 8:30 am Folgetag; zugewiesen wird sie auf der Notdienst-Seite, nur an Apotheker:innen. Die App schreibt f\xFCr N\xE4chte keine automatischen Stunden ins Konto: N\xE4chte werden im selben Monat als \xDCberstunden ausbezahlt, die Zuschl\xE4ge rechnet die Lohnbuchhaltung. Wer stattdessen Freizeit m\xF6chte, bekommt die Stunden (Zahl vom Steuerb\xFCro) von der Leitung als Stundenkorrektur eingetragen.",(0,Mt.jsx)("strong",{children:" \xDCbertariflich abgegolten"})," = nur Doku."]})},{id:"feiertage",title:"Feiertage & Ferien",teaser:"Feiertag schreibt Musterstunden gut, Ferien sind nur Anzeige",body:(0,Mt.jsx)(Mt.Fragment,{children:"Gesetzliche Feiertage (Bayern) sind im Planer grau. Wer laut Muster gearbeitet h\xE4tte, bekommt die Tagesstunden gutgeschrieben. Kein Minus durch den Feiertag. Schulferien werden nur angezeigt, sie \xE4ndern keine Stunden."})},{id:"schliesstage",title:"Halbe Schlie\xDFtage (24.12. + 31.12.)",teaser:"Heiligabend und Silvester: vormittags offen, ab 13:00 zu",body:(0,Mt.jsx)(Mt.Fragment,{children:"An Heiligabend und Silvester sind beide Apotheken vormittags offen und ab 13:00 geschlossen. Im Wochenplaner ist der Nachmittag an diesen Tagen grau markiert, dort wird nicht eingeplant. Wie der freie Nachmittag auf dem Stundenkonto z\xE4hlt, legt die Leitung fest und tr\xE4gt die Regel hier nach \u2014 bis dahin \xE4ndern diese Tage nichts an der Soll-Rechnung."})},{id:"profile",title:"Schichtprofile",teaser:"Wochen-Rhyth
