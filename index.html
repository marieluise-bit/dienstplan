che, anteilig nach Arbeitstagen, ohne Rundung. Bei Elternzeit oder Ein-/Austritt k\xFCrzt die App um 1/12 pro vollem Kalendermonat (Zw\xF6lftelung). Das ist ein Vorschlag, den die Leitung best\xE4tigt.']})},{id:"notdienst",title:"Notdienst",teaser:"Nacht ab 19:00 (Ladenschluss), Auszahlung statt automatischer Gutschrift",body:(0,Dt.jsxs)(Dt.Fragment,{children:["Tags\xFCber wird der Dienst normal im Plan eingetragen und z\xE4hlt ins Ist. Die Nachtbereitschaft beginnt um 19:00 mit dem Ladenschluss und geht bis 8:30 am Folgetag; zugewiesen wird sie auf der Notdienst-Seite, nur an Apotheker:innen. Die App schreibt f\xFCr N\xE4chte keine automatischen Stunden ins Konto: N\xE4chte werden im selben Monat als \xDCberstunden ausbezahlt, die Zuschl\xE4ge rechnet die Lohnbuchhaltung. Wer stattdessen Freizeit m\xF6chte, bekommt die Stunden (Zahl vom Steuerb\xFCro) von der Leitung als Stundenkorrektur eingetragen.",(0,Dt.jsx)("strong",{children:" \xDCbertariflich abgegolten"})," = nur Doku."]})},{id:"feiertage",title:"Feiertage & Ferien",teaser:"Feiertag schreibt Musterstunden gut, Ferien sind nur Anzeige",body:(0,Dt.jsx)(Dt.Fragment,{children:"Gesetzliche Feiertage (Bayern) sind im Planer grau. Wer laut Muster gearbeitet h\xE4tte, bekommt die Tagesstunden gutgeschrieben. Kein Minus durch den Feiertag. Schulferien werden nur angezeigt, sie \xE4ndern keine Stunden."})},{id:"schliesstage",title:"Sondertage & halbe Schlie\xDFtage (24.12., 31.12., Fasching ...)",teaser:"Verk\xFCrzt offen: wer kommt, verliert nichts \u2014 so z\xE4hlen die Stunden",body:(0,Dt.jsxs)(Dt.Fragment,{children:["Sondertage sind Ausnahme-Tage mit eigenen \xD6ffnungszeiten, z. B. Heiligabend und Silvester (offen bis 13:00) oder regionale Tage wie der Faschingsdienstag. Die Leitung hinterlegt sie auf der Filialen-Seite; im Wochenplaner und im Druck sind die geschlossenen Zeiten grau, der Name steht \xFCber dem Tag.",(0,Dt.jsx)("br",{}),(0,Dt.jsx)("strong",{children:"So z\xE4hlen die Stunden an einem halben Schlie\xDFtag:"}),(0,Dt.jsx)("br",{}),"1. Wer arbeitet und wegen der fr\xFChen Schlie\xDFung k\xFCrzer da ist als an einem normalen Arbeitstag, bekommt die Differenz bis zu seinen normalen Tagesstunden gutgeschrieben. Durch den Sondertag entstehen keine Minusstunden.",(0,Dt.jsx)("br",{}),"2. Wer an seinem eigentlich freien Tag trotzdem kommt, bekommt die gearbeiteten Stunden als Plus \u2014 wie an jedem anderen Tag.",(0,Dt.jsx)("br",{}),"3. Wer laut Plan normal gearbeitet h\xE4tte und gar nicht kommt, bekommt die",(0,Dt.jsx)("strong",{children:" halben pers\xF6nlichen Tagesstunden"})," als Minus. Die geschlossene Tagesh\xE4lfte wird also allen geschenkt, nur die offene H\xE4lfte z\xE4hlt.",(0,Dt.jsx)("br",{}),"4. Wer an dem Tag Urlaub hat, gibt einen ganzen Urlaubstag ab und bekommt daf\xFCr die vollen durchschnittlichen Tagesstunden gutgeschrieben \u2014 auch hier kein Minus.",(0,Dt.jsx)("br",{}),'Umgesetzt wird das \xFCber den Vorschlagsmodus: Am Sondertag rechnet die App pro Person einen Korrektur-Vorschlag nach diesen Regeln ("\xB1 Vorschl\xE4ge" im Wochenplaner-Tageskopf), die Leitung w\xE4hlt ab und best\xE4tigt. Eingetragen wird alles als normale Stundenkorrektur (Kategorie Sondertag, mit Begr\xFCndung, nachtr\xE4glich \xE4nderbar). Gemalte Stunden z\xE4hlen an Sondertagen ganz normal weiter.']})},{id:"profile",title:"Schichtprofile",teaser:"Wochen-Rhythmus pro Person, versioniert ab KW X",body:(0,Dt.jsxs)(Dt.Fragment,{children:['Jede Person hat ihren wiederkehrenden Wochen-Rhythmus als Profil (1 bis 4 Wochen, Wochen A bis D). Es steuert "Aus Schichtprofilen bef\xFCllen", "Jahr ausrollen" und die Urlaubsz\xE4hlung. \xC4ndert sich der Rhythmus unterm Jahr, wird eine',(0,Dt.jsx)("strong",{children:' neue Version "g\xFCltig ab KW X"'})," angelegt. Alte KWs rechnen weiter mit der alten Version. Bereits eingetragene Wochen \xE4ndern sich durch Profil-\xC4nderungen nie."]})},{id:"antraege",title:"Urlaubsantr\xE4ge & Sperren",teaser:"Genehmigt wird eingetragen, Sperrze
