 versioniert ab KW X",body:(0,Ot.jsxs)(Ot.Fragment,{children:['Jede Person hat ihren wiederkehrenden Wochen-Rhythmus als Profil (1 bis 4 Wochen, Wochen A bis D). Es steuert "Aus Schichtprofilen bef\xFCllen", "Jahr ausrollen" und die Urlaubsz\xE4hlung. \xC4ndert sich der Rhythmus unterm Jahr, wird eine',(0,Ot.jsx)("strong",{children:' neue Version "g\xFCltig ab KW X"'})," angelegt. Alte KWs rechnen weiter mit der alten Version. Bereits eingetragene Wochen \xE4ndern sich durch Profil-\xC4nderungen nie."]})},{id:"antraege",title:"Urlaubsantr\xE4ge & Sperren",teaser:"Genehmigt wird eingetragen, Sperrzeiten nur per Ausnahme-Antrag",body:(0,Ot.jsx)(Ot.Fragment,{children:'Antr\xE4ge laufen \xFCber "Urlaub & Tausch". Genehmigter Urlaub wird automatisch eingetragen. In gesperrten Zeitr\xE4umen (z. B. Inventur) ist kein normaler Antrag m\xF6glich. F\xFCr H\xE4rtef\xE4lle gibt es den Ausnahme-Antrag mit Pflicht-Begr\xFCndung. Genehmigt wird nichts automatisch.'})},{id:"konflikte",title:"Konflikte",teaser:"Pausen, 10-h-Grenze, Ruhezeit, Apotheker-Pflicht, bewusstes Abhaken",leitungOnly:!0,body:(0,Ot.jsx)(Ot.Fragment,{children:"Die App warnt bei: \xFCber 6 h am St\xFCck ohne 30-min-Pause (ArbZG \xA74). \xDCber 9 h braucht es 45 min Pause. \xDCber 10 h am Tag (\xA73). Schicht am Tag nach der Notdienst-Nacht, 11 h Ruhezeit (\xA75), auch \xFCber den Wochenwechsel. \xD6ffnungszeiten ohne Apotheker:in (ApBetrO). Schicht trotz Elternzeit oder Sonstiges. Ausnahme: Macht dieselbe Apotheker:in maximal 2 h Pause und arbeitet davor und danach in der Filiale, gilt sie als im Haus. Dann keine Warnung. Bewusste Entscheidungen (z. B. Denis ohne Pause) hakst du dauerhaft ab. Das dokumentiert, dass es gesehen wurde. Nach einem Excel-Neuimport erscheinen Abweichungen zwischen App und Excel als Konflikte zum Nachpr\xFCfen."})},{id:"korrekturen",title:"Stundenkorrekturen",teaser:"\xB1 Stunden pro Person und Tag, mit Begr\xFCndung, sofort im Ist",leitungOnly:!0,body:(0,Ot.jsx)(Ot.Fragment,{children:
